name: Deploy Dashboard

# Regenerates the dashboard (python main.py, lean scope -- no --detailed/
# --export-excel, keeps every push fast and the S3 footprint small) on
# every push to main and syncs it to the public S3 bucket. Auth is via
# GitHub's own OIDC token -- no long-lived AWS keys stored anywhere (see
# ROADMAP.txt section 0a).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # required to request the OIDC token AWS trusts
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start clean (remove any stale reports/data)
        run: rm -rf reports data logs && mkdir -p reports data logs

      # report_format defaults to 'html' (src/config.py), so no WeasyPrint
      # system libs are needed for this lean build. --no-email guarantees
      # no notification side-effect from this job regardless of secrets --
      # that's daily-summary.yml's job, not this one's.
      - name: Build dashboard
        run: python main.py --force-refresh --no-email

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # --delete removes anything in the bucket no longer produced by this
      # run (e.g. a stock delisted from the watchlist), so the bucket never
      # accumulates stale pages.
      - name: Sync to S3
        run: aws s3 sync reports/ "s3://${{ vars.S3_DASHBOARD_BUCKET }}/" --delete

      - name: Show dashboard URL
        run: |
          echo "Live at: http://${{ vars.S3_DASHBOARD_BUCKET }}.s3-website-${{ vars.AWS_REGION }}.amazonaws.com/"
