name: NSE Notifications (Open / Mid / Close)

# Runs on GitHub's cloud — independent of any laptop. Three checkpoints a
# day (see ROADMAP.txt section 1): open (email, full summary), mid and
# close (Telegram, intraday pulse / EOD summary). Was a single evening
# email; now a 3x/day multi-channel schedule.
on:
  schedule:
    # Times in UTC; EAT = UTC+3, Kenya doesn't observe DST.
    - cron: '15 6 * * 1-5'   # 09:15 EAT -- market open  -- email
    - cron: '0 9 * * 1-5'    # 12:00 EAT -- mid-day       -- Telegram
    - cron: '20 12 * * 1-5'  # 15:20 EAT -- market close  -- Telegram
    # Note: GitHub cron is UTC and may start a few minutes late under load.
  workflow_dispatch:         # manual "Run workflow" from the Actions tab
    inputs:
      checkpoint:
        description: 'Checkpoint to run'
        required: true
        default: 'open'
        type: choice
        options: [open, mid, close]

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write   # needed to delete the previous run's artifact
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub tells a scheduled run which cron expression fired it
      # (github.event.schedule); a manual run picks the checkpoint via the
      # workflow_dispatch input above. Falls back to 'open' if neither
      # matches (should never happen, but never silently no-op either).
      - name: Determine checkpoint
        id: checkpoint
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.checkpoint }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              '15 6 * * 1-5') echo "value=open" >> "$GITHUB_OUTPUT" ;;
              '0 9 * * 1-5') echo "value=mid" >> "$GITHUB_OUTPUT" ;;
              '20 12 * * 1-5') echo "value=close" >> "$GITHUB_OUTPUT" ;;
              *) echo "value=open" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install system libraries for WeasyPrint (PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libcairo2 libffi-dev libjpeg-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start clean (remove any stale reports/data)
        run: rm -rf reports data logs && mkdir -p reports data logs

      # Delete the PREVIOUS run's artifact just before generating the new one,
      # so at most ONE summary artifact ever exists on GitHub (the latest).
      # Nothing accumulates and no meaningful storage is used.
      - name: Delete previous summary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
                  --jq '.artifacts[] | select(.name=="nse-summary") | .id')
          for id in $ids; do
            echo "Deleting old artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      # Scheduled runs skip weekends & Kenyan public holidays (send_summary.py
      # checks the calendar). Manual runs pass --ignore-calendar so you can
      # always test on any day. send_summary.py's own checkpoint dispatch
      # decides which channel actually fires (open->email, mid/close->
      # Telegram) -- both sets of secrets are always available here, the
      # unused set is simply never read for a given checkpoint.
      - name: Build and send the summary
        env:
          ENABLE_EMAIL_NOTIFICATIONS: 'true'
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          ENABLE_TELEGRAM_NOTIFICATIONS: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--force-refresh --checkpoint ${{ steps.checkpoint.outputs.value }}"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            ARGS="$ARGS --ignore-calendar"
          fi
          python send_summary.py $ARGS

      # Keep ONLY the newest PDF as a single downloadable backup (in case an
      # email fails). It is replaced every run by the delete step above, so it
      # never accumulates. Nothing is ever committed back to the repo.
      - name: Upload latest summary (single backup, replaced each run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-summary
          path: reports/nse_summary_*.pdf
          if-no-files-found: ignore
          retention-days: 7
