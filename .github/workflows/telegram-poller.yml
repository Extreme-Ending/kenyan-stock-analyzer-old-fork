name: Telegram Bot Poller

# Polls Telegram for new inbound messages every 5 minutes (GitHub's
# minimum cron granularity) -- there's no persistent server here to
# receive a real-time webhook, so this is the AWS-free alternative (see
# ROADMAP.txt section 1b-ii). Telegram's own getUpdates offset mechanism
# tracks what's already been seen; no local state needed for that part.
#
#   - Anyone who messages the bot for the first time is added to the
#     persisted subscriber list (data/history/telegram_subscribers.json,
#     committed back to the repo by this workflow) and immediately sent
#     the current summary + PDF as a welcome. They then also receive
#     every future scheduled broadcast (daily-summary.yml's mid/close
#     checkpoints already read this same list).
#   - Only the configured TELEGRAM_CHAT_ID (the owner) can send /refresh,
#     which triggers a full data refresh + dashboard redeploy (the
#     second job below) and gets the fresh summary sent back privately --
#     never broadcast to other subscribers, to avoid spamming them every
#     time the owner tests something.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: telegram-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      refresh_requested: ${{ steps.poll.outputs.refresh_requested }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Poll Telegram for new messages
        id: poll
        env:
          ENABLE_TELEGRAM_NOTIFICATIONS: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_poller.py

      # Only the subscriber list can change here (telegram_poller.py never
      # touches anything else) -- commit it back so it survives to the
      # next scheduled run and to daily-summary.yml's broadcasts.
      - name: Commit subscriber list if it changed
        run: |
          # git add first: git diff alone never shows a brand-new
          # untracked file (the very first subscriber ever recorded),
          # only changes to already-tracked ones. Staging it first makes
          # `git diff --cached` correctly cover both cases.
          git add data/history/telegram_subscribers.json 2>/dev/null || true
          if ! git diff --cached --quiet -- data/history/telegram_subscribers.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(telegram): update subscriber list"
            git pull --rebase --autostash
            git push
          else
            echo "No subscriber changes."
          fi

  refresh-dashboard:
    needs: poll
    if: needs.poll.outputs.refresh_requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start clean (remove any stale reports/data)
        run: rm -rf reports data logs && mkdir -p reports data logs

      - name: Build dashboard
        run: python main.py --force-refresh --no-email

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
