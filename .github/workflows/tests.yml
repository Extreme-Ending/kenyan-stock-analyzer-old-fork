name: Tests

# Runs the unit test suite (test.py) on every push and pull request --
# separate from daily-summary.yml (the scheduled notification job), so a
# broken test blocks/flags a PR long before it could ever reach the
# scheduled run. See ROADMAP.txt section 2.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # README's stated baseline (3.11 -- tvkit requires it, discovered
        # when 3.10 failed dependency install here) and this project's
        # actual dev venv (3.12, per CLAUDE.md) -- catches anything that
        # only works on one of the two versions we claim to support.
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # test.py never hits live network (synthetic OHLCV via a fixed seed,
      # per CLAUDE.md's Testing section) -- deterministic and safe to run
      # on every push/PR without secrets or external services.
      - name: Run test suite
        run: python test.py
