name: Tests

# Runs the unit test suite (test.py) on every push and pull request --
# separate from daily-summary.yml (the scheduled notification job), so a
# broken test blocks/flags a PR long before it could ever reach the
# scheduled run. See ROADMAP.txt section 2.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Real minimum is 3.12 -- numpy>=2.5.0 requires it (discovered here:
        # 3.10 failed on tvkit needing 3.11+, then 3.11 failed on numpy
        # needing 3.12+, corrected in README.md/CLAUDE.md too). 3.13 is the
        # next minor, to catch anything that only works on one of the two.
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # test.py never hits live network (synthetic OHLCV via a fixed seed,
      # per CLAUDE.md's Testing section) -- deterministic and safe to run
      # on every push/PR without secrets or external services.
      - name: Run test suite
        run: python test.py
